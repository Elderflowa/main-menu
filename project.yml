name: MainMenu
options:
  bundleIdPrefix: dev.elder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MainMenu:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Main Menu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        LSApplicationQueriesSchemes:
          - hollowknight
          - hollow-knight
          - hollowknightmobile
          - teamcherry
          - hollowknightsilksong
          - silksong
          - balatro
          - playstack
          - localthunk
          - balatromobile
          - tft
          - teamfighttactics
          - tftmobile
          - tacticians
          - riot
          - riotgames
          - riotmobile
          - riotclient
          - riotid
          - lol
          - leagueoflegends
          - wildrift
          - valorant
          - lor
          - legendsofruneterra
          - genshin
          - genshinimpact
          - hoyoverse
          - mihoyo
          - hoyolab
          - hoyoplay
          - hsr
          - starrail
          - zzz
          - netflix
          - netflixgames
          - unity
          - unityads
          - gamecenter
          - gamecenter-games
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalSceneDelegate
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.elder.mainmenu
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
