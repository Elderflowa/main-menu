name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish as a tagged release, for example 1.2.0 (leave empty for a normal build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BIRDS_EYE_TOKEN: ${{ secrets.BIRDS_EYE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        run: |
          BASE=$(grep -m1 'MARKETING_VERSION:' project.yml | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.release_version }}" ]]; then
            V="${{ inputs.release_version }}"
          else
            V="$BASE.${{ github.run_number }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project MainMenu.xcodeproj \
            -scheme MainMenu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/MainMenu.xcarchive" \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/MainMenu.xcarchive/Products/Applications/MainMenu.app Payload/
          zip -qry MainMenu.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MainMenu-ipa
          path: MainMenu.ipa

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then TAG="v${{ inputs.release_version }}"; fi
          gh release create "$TAG" MainMenu.ipa --target "$GITHUB_SHA" \
            --title "Main Menu ${{ steps.ver.outputs.version }}" \
            --notes-file RELEASE_NOTES.md

      - name: Publish rolling release (direct link for Feather)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.release_version == '' }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" --notes "Unsigned IPA from the newest commit, sign it with Feather."
          gh release upload latest MainMenu.ipa --clobber

      - name: Tell Birds Eye there is a new build
        if: env.BIRDS_EYE_TOKEN != ''
        run: gh workflow run update.yml -R Elderflowa/birds-eye
        env:
          GH_TOKEN: ${{ secrets.BIRDS_EYE_TOKEN }}
